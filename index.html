<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spider Lint</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1b191e;
        --paper: #f7f4ef;
        --muted: #5c5863;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f4f1ea;
          --paper: #16141a;
          --muted: #b3adb8;
        }
      }
      body {
        margin: 0 auto;
        max-width: 36rem;
        padding: 2rem 1.25rem;
        background: var(--paper);
        color: var(--ink);
        font:
          1rem/1.55 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      a {
        color: inherit;
      }
      p {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Spider Lint</h1>
    <p>A Chrome extension that finds accessibility errors on the page.</p>
    <p>
      <a href="./privacy.html">Privacy policy</a>
    </p>
  </body>
</html>
